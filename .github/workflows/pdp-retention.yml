name: UU PDP Data Retention Schedule

on:
  schedule:
    # Setiap hari Minggu pukul 02:00 WIB (19:00 UTC Sabtu)
    - cron: "0 19 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Jalankan dalam mode simulasi (dry-run)"
        required: false
        default: true
        type: boolean

jobs:
  pdp-retention-purge:
    name: Purge Expired Personal Data (UU PDP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install system dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock

      - name: Run UU PDP retention command
        env:
          APP_ENV: production
          SECRET_KEY: ${{ secrets.SECRET_KEY || secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS || 'localhost' }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS || 'https://localhost' }}
          NIK_ENCRYPTION_KEY: ${{ secrets.NIK_ENCRYPTION_KEY }}
          NIK_HMAC_KEY: ${{ secrets.NIK_HMAC_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_SSL_DISABLED: ${{ secrets.DB_SSL_DISABLED || 'False' }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SECRET_KEY" ] || [ -z "$DB_HOST" ] || [ -z "$DB_NAME" ]; then
            echo "SECRET_KEY/DB_HOST/DB_NAME secrets are not configured; skipping remote PDP purge."
            exit 0
          fi
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAG="--dry-run"
          fi
          python manage.py purge_expired_pdp_data $FLAG
