{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Buku Tamu Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a2558;
            --secondary: #3b82f6;
            --accent: #60a5fa;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .reset-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(10, 37, 88, 0.05);
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border-soft);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--secondary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: block;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group-custom input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3rem;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .input-group-custom input:focus {
            outline: none;
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #081d45;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(10,37,88,0.2);
        }

        .footer-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
        }

        .footer-link a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="icon-box">
        <i class="fas fa-key"></i>
    </div>
    
    <h1 class="title">Lupa Password?</h1>
    <p class="subtitle">Masukkan email Anda yang terdaftar. Kami akan mengirimkan link untuk mereset password.</p>

    <form method="post">
        {% csrf_token %}
        
        <label class="form-label" for="id_email">Email Terdaftar</label>
        <div class="input-group-custom">
            <i class="far fa-envelope input-icon"></i>
            {{ form.email }}
        </div>

        {% if form.email.errors %}
        <div class="alert-error">
            {{ form.email.errors.0 }}
        </div>
        {% endif %}

        <button type="submit" class="btn-submit">
            Kirim Email Reset <i class="fas fa-paper-plane"></i>
        </button>
    </form>

    <div class="footer-link">
        <a href="{% url 'tamu:login' %}"><i class="fas fa-arrow-left me-1"></i> Kembali ke Login</a>
    </div>
</div>

</body>
</html>
