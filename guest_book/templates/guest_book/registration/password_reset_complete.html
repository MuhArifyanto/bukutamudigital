{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Berhasil - Buku Tamu Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a2558;
            --secondary: #3b82f6;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .reset-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(10, 37, 88, 0.05);
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border-soft);
            text-align: center;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 2rem;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
            margin-top: 1rem;
            text-decoration: none;
        }

        .btn-submit:hover {
            background: #081d45;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(10,37,88,0.2);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="icon-box">
        <i class="fas fa-check-circle"></i>
    </div>
    
    <h1 class="title">Reset Berhasil!</h1>
    <p class="subtitle">Password Anda sudah diperbarui. Silakan login kembali dengan password baru Anda.</p>

    <div class="d-grid mt-4">
        <a href="{% url 'tamu:login' %}" class="btn-submit">Silakan Login <i class="fas fa-sign-in-alt"></i></a>
    </div>
</div>

</body>
</html>
