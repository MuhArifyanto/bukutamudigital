<h2>Buat Password Baru</h2>
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Simpan Password Baru</button>
    </form>
{% else %}
    <p>Link reset tidak valid atau sudah kedaluwarsa.</p>
    <p><a href="{% url 'tamu:password_reset' %}">Minta link baru</a></p>
{% endif %}
